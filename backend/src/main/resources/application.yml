server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: link-health-api
  profiles:
    # Desenvolvimento local usa o PostgreSQL configurado em backend/.env.
    # Para executar sem banco, defina SPRING_PROFILES_ACTIVE=local no terminal.
    default: postgres
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      # Reserva espaço para os cabeçalhos multipart sem reduzir o limite de 5 MB da foto.
      max-request-size: 6MB

link-health:
  security:
    enabled: ${LINK_HEALTH_SECURITY_ENABLED:true}
    api-key: ${LINK_HEALTH_API_KEY:}
    allowed-origins: ${LINK_HEALTH_ALLOWED_ORIGINS:}
    require-https: ${LINK_HEALTH_REQUIRE_HTTPS:false}
    rate-limit-per-minute: ${LINK_HEALTH_RATE_LIMIT_PER_MINUTE:120}
  photos:
    storage-directory: ${LINK_HEALTH_PHOTOS_DIRECTORY:${user.home}/AppData/Local/LinkHealth/evolution-photos}
    max-size-bytes: 5242880
    encryption-key: ${LINK_HEALTH_PHOTOS_ENCRYPTION_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
